name: stateless-kitcontrol-exec

on:
  pull_request:
    paths:
      - "packages/coding-agent/src/mcp/standalone-bash.ts"
      - "packages/coding-agent/src/mcp/standalone-harness.ts"
      - "packages/coding-agent/test/mcp-standalone-bash.test.ts"
      - "packages/coding-agent/test/mcp-stateless-kitcontrol-exec.test.ts"
      - ".github/workflows/stateless-kitcontrol-exec.yml"
  push:
    branches:
      - "hotfix/**"
    paths:
      - "packages/coding-agent/src/mcp/standalone-bash.ts"
      - "packages/coding-agent/src/mcp/standalone-harness.ts"
      - "packages/coding-agent/test/mcp-standalone-bash.test.ts"
      - "packages/coding-agent/test/mcp-stateless-kitcontrol-exec.test.ts"
      - ".github/workflows/stateless-kitcontrol-exec.yml"

permissions:
  contents: write

jobs:
  focused-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Harden changed lifecycle regression on hotfix push
        if: github.event_name == 'push'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('packages/coding-agent/test/mcp-standalone-bash.test.ts')
          s = p.read_text()
          old = 'for (let i = 0; i < 50 && !(await Bun.file(started).exists()); i++) await Bun.sleep(5);'
          new = 'for (let i = 0; i < 400 && !(await Bun.file(started).exists()); i++) await Bun.sleep(5);'
          if old in s:
              p.write_text(s.replace(old, new, 1))
          elif new not in s:
              raise SystemExit('expected lifecycle wait loop not found')
          PY
          if ! git diff --quiet -- packages/coding-agent/test/mcp-standalone-bash.test.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add packages/coding-agent/test/mcp-standalone-bash.test.ts
            git commit -m "test(mcp): tolerate parallel startup latency"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify canonical focused formatting
        run: |
          npx --yes oxfmt --check \
            packages/coding-agent/src/mcp/standalone-bash.ts \
            packages/coding-agent/src/mcp/standalone-harness.ts \
            packages/coding-agent/test/mcp-standalone-bash.test.ts \
            packages/coding-agent/test/mcp-stateless-kitcontrol-exec.test.ts
          git diff --check
      - name: Type check coding-agent
        run: bun --cwd packages/coding-agent run check:types
      - name: Run standalone KitControl execution regressions
        run: >-
          bun test
          packages/coding-agent/test/mcp-standalone-bash.test.ts
          packages/coding-agent/test/mcp-stateless-kitcontrol-exec.test.ts
