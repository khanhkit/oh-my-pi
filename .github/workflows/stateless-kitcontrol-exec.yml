name: stateless-kitcontrol-exec

on:
  pull_request:
    paths:
      - "packages/coding-agent/src/mcp/standalone-bash.ts"
      - "packages/coding-agent/src/mcp/standalone-harness.ts"
      - "packages/coding-agent/test/mcp-standalone-bash.test.ts"
      - "packages/coding-agent/test/mcp-stateless-kitcontrol-exec.test.ts"
      - ".github/workflows/stateless-kitcontrol-exec.yml"
  push:
    branches:
      - "hotfix/**"
    paths:
      - "packages/coding-agent/src/mcp/standalone-bash.ts"
      - "packages/coding-agent/src/mcp/standalone-harness.ts"
      - "packages/coding-agent/test/mcp-standalone-bash.test.ts"
      - "packages/coding-agent/test/mcp-stateless-kitcontrol-exec.test.ts"
      - ".github/workflows/stateless-kitcontrol-exec.yml"

permissions:
  contents: write

jobs:
  focused-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Apply canonical formatting on hotfix push
        if: github.event_name == 'push'
        run: |
          npx --yes oxfmt \
            packages/coding-agent/src/mcp/standalone-bash.ts \
            packages/coding-agent/src/mcp/standalone-harness.ts \
            packages/coding-agent/test/mcp-standalone-bash.test.ts \
            packages/coding-agent/test/mcp-stateless-kitcontrol-exec.test.ts
          if ! git diff --quiet -- \
            packages/coding-agent/src/mcp/standalone-bash.ts \
            packages/coding-agent/src/mcp/standalone-harness.ts \
            packages/coding-agent/test/mcp-standalone-bash.test.ts \
            packages/coding-agent/test/mcp-stateless-kitcontrol-exec.test.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              packages/coding-agent/src/mcp/standalone-bash.ts \
              packages/coding-agent/src/mcp/standalone-harness.ts \
              packages/coding-agent/test/mcp-standalone-bash.test.ts \
              packages/coding-agent/test/mcp-stateless-kitcontrol-exec.test.ts
            git commit -m "style(mcp): apply canonical formatter"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Verify canonical focused formatting
        run: |
          npx --yes oxfmt --check \
            packages/coding-agent/src/mcp/standalone-bash.ts \
            packages/coding-agent/src/mcp/standalone-harness.ts \
            packages/coding-agent/test/mcp-standalone-bash.test.ts \
            packages/coding-agent/test/mcp-stateless-kitcontrol-exec.test.ts
          git diff --check
      - name: Run standalone KitControl execution regressions
        run: >-
          bun test
          packages/coding-agent/test/mcp-standalone-bash.test.ts
          packages/coding-agent/test/mcp-stateless-kitcontrol-exec.test.ts
