name: git-admin-dispatcher

on:
  pull_request:
    paths:
      - "packages/coding-agent/src/mcp/standalone-harness.ts"
      - "packages/coding-agent/src/mcp/standalone-kitcontrol-git-admin.ts"
      - "packages/coding-agent/test/mcp-git-admin.test.ts"
      - ".github/workflows/git-admin-dispatcher.yml"
  push:
    branches:
      - "hotfix/**"
    paths:
      - "packages/coding-agent/src/mcp/standalone-harness.ts"
      - "packages/coding-agent/src/mcp/standalone-kitcontrol-git-admin.ts"
      - "packages/coding-agent/test/mcp-git-admin.test.ts"
      - ".github/workflows/git-admin-dispatcher.yml"

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify focused formatting
        run: |
          npx --yes oxfmt --check \
            packages/coding-agent/src/mcp/standalone-harness.ts \
            packages/coding-agent/src/mcp/standalone-kitcontrol-git-admin.ts \
            packages/coding-agent/test/mcp-git-admin.test.ts
          git diff --check
      - name: Type check coding-agent
        run: bun --cwd packages/coding-agent run check:types
      - name: Run Git administration regressions
        run: bun test packages/coding-agent/test/mcp-git-admin.test.ts packages/coding-agent/test/mcp-stateless-kitcontrol-exec.test.ts
